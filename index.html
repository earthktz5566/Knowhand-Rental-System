<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F14">
  <title>รู้มือ — เช็คของว่าง · จองอุปกรณ์</title>
  <meta name="description" content="รู้มือ (Know Hand Rental House) — เช็คของว่างและจองอุปกรณ์ถ่ายทำ">
  <meta name="robots" content="noindex">

  <!-- ============================================================
       index.html — ตัว "ห่อ" หน้าจองของระบบรู้มือ (Apps Script Web App)
       หลักการ: เต็มจอ 1 iframe → address bar โชว์โดเมนของเรา (github.io / subdomain ตัวเอง)
       ⚠️ ต้องให้ฝั่ง Apps Script ตั้ง setXFrameOptionsMode(ALLOWALL) เท่านั้น (ระบบรู้มือตั้งไว้แล้ว)
       ⚠️ ถ้าถูกบล็อก (in-app browser ของ FB/IG/LINE/TikTok) จะขึ้นปุ่ม "เปิดหน้าจองเลย" ให้แทน
       ============================================================ -->

  <style>
    :root { --bg:#0B0F14; --card:#121821; --text:#E7ECF3; --soft:#9AA6B6; --accent:#25BB89; --ink:#0B0F14; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
                 font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans Thai', sans-serif; }
    #app { position: fixed; inset: 0; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }

    /* ---- splash ระหว่างรอ ---- */
    #splash {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
      background: var(--bg); transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    .mark {
      width: 58px; height: 58px; border-radius: 16px; background: var(--accent); color: var(--ink);
      display: grid; place-items: center; font-weight: 800; font-size: 30px; line-height: 1;
    }
    #splash h1 { margin: 4px 0 0; font-size: 20px; }
    #splash p { margin: 0; color: var(--soft); font-size: 14px; }
    .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(37,187,137,.25);
            border-top-color: var(--accent); animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

  </style>
</head>
<body>

<div id="app">
  <!-- หน้าจองของระบบ (Apps Script) — เปลี่ยน URL ตรงนี้ที่เดียวถ้าย้าย deployment -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbw3tb3vx_twzRT2obFNK3oLLJfu0f4Kjw2iS7CJrFkxX_5Y1xNKnPiFeZrTMkdvzbE7/exec?p=public"
    allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"
    title="หน้าจองอุปกรณ์ รู้มือ"></iframe>
</div>

<div id="splash">
  <!-- ถ้าต้องการใช้โลโก้รูป: ใส่ URL แล้วแทน .mark ด้านล่างด้วย <img src="..." style="height:56px"> -->
  <div class="mark">ร</div>
  <h1>รู้มือ · Know Hand Rental House</h1>
  <p>กำลังเปิดหน้าจอง…</p>
  <div class="spin" id="spin"></div>

</div>

<script>
(function () {
  var APP_URL = document.getElementById('appFrame').src;
  var splash = document.getElementById('splash');
  var loaded = false;

  var frame = document.getElementById('appFrame');

  function ok() {
    loaded = true;
    splash.classList.add('hide');
    setTimeout(function () { splash.style.display = 'none'; }, 400);
  }

  // 1) ถ้าแอป (Apps Script) ส่งสัญญาณ postMessage มาว่าโหลดเสร็จ → ซ่อน splash เร็วขึ้น
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (d && typeof d === 'object' && d.kh === 'ready') ok();
  });

  // 2) ทางสำรอง: iframe ยิง load แล้วรออีกนิด → ถือว่าเปิดได้ (ไม่ค้าง splash ให้ผู้ใช้งง)
  frame.addEventListener('load', function () { setTimeout(ok, 1200); });

  // 3) กันเหนียว: ไม่ว่าเกิดอะไร อย่าให้ค้างหน้า splash เกิน 10 วิ
  setTimeout(ok, 10000);
})();
</script>
</body>
</html>
